[project]
name = "igsn-helper"
version = "0.1.0"
description = "Draft DataCite/IGSN metadata records for physical samples from free-text submissions (PDF, DOCX) with a local LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "python-docx>=1.1",
    "pydantic>=2.0",
    "reportlab>=4.0",
    "pdfplumber>=0.11.10",
]

[tool.uv]
package = false
